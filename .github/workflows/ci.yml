name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to AWS (requires AWS_ROLE_ARN secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=fargate_app --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fargate-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy:
    name: Deploy (manual, OIDC)
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [python, docker, terraform]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Ensure ECR repository exists
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve -target=module.ecr

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REPO_NAME="fargate-app-dev"
          IMAGE_URI="${ECR_REGISTRY}/${REPO_NAME}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" -t "${ECR_REGISTRY}/${REPO_NAME}:latest" .
          docker push "$IMAGE_URI"
          docker push "${ECR_REGISTRY}/${REPO_NAME}:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Terraform plan & apply
        working-directory: terraform
        run: |
          terraform init
          terraform plan \
            -var="container_image=${IMAGE_URI}" \
            -out=tfplan
          terraform apply -auto-approve tfplan
          terraform output
